<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>正文配图 · 回答效果预览</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #fff;
        --text: #252525;
        --muted: #757575;
        --soft: #f5f5f5;
        --line: #e9e9e9;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --bg: #212121;
        --text: #ececec;
        --muted: #aaa;
        --soft: #303030;
        --line: #3b3b3b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.85 system-ui,
          -apple-system,
          'Segoe UI',
          'Microsoft YaHei',
          sans-serif;
      }
      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid #24806a;
        outline-offset: 4px;
      }
      header {
        min-height: 70px;
        border-bottom: 1px solid var(--line);
        padding: 16px 30px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
        font-size: 15px;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        background: #e9f2ee;
        color: #286350;
        border-radius: 9px;
      }
      #theme {
        border: 1px solid var(--line);
        background: var(--bg);
        border-radius: 20px;
        padding: 5px 14px;
        font-size: 13px;
      }
      main {
        width: min(720px, calc(100% - 48px));
        margin: 48px auto 88px;
      }
      .question {
        max-width: 510px;
        margin-left: auto;
        border-radius: 24px;
        padding: 14px 22px;
        background: var(--soft);
        line-height: 1.7;
      }
      article {
        margin-top: 36px;
      }
      .byline {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
        font-weight: 600;
        font-size: 14px;
      }
      .avatar {
        display: grid;
        place-items: center;
        width: 27px;
        height: 27px;
        border: 1px solid var(--line);
        border-radius: 50%;
        font-size: 17px;
      }
      .lead {
        margin: 0 0 24px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 25px;
        line-height: 1.5;
        letter-spacing: -0.4px;
      }
      h2 {
        margin: 0 0 9px;
        font-size: 19px;
        line-height: 1.6;
      }
      p {
        margin: 0 0 18px;
      }
      .answer-section {
        margin-top: 30px;
      }
      figure {
        margin: 20px 0 0;
      }
      .image-open {
        display: block;
        border: 0;
        border-radius: 14px;
        overflow: hidden;
        padding: 0;
        background: var(--soft);
        width: 100%;
        line-height: 0;
      }
      .image-open img {
        display: block;
        width: 100%;
        height: auto;
        max-height: 360px;
        object-fit: contain;
      }
      figcaption {
        margin-top: 9px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.65;
        overflow-wrap: anywhere;
      }
      a {
        color: inherit;
        text-underline-offset: 3px;
      }
      .tip {
        margin: 30px 0 0;
        padding: 14px 18px;
        background: var(--soft);
        border-radius: 12px;
        font-size: 14px;
      }
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        border-top: 1px solid var(--line);
        padding-top: 16px;
        margin-top: 28px;
        color: var(--muted);
        font-size: 12px;
      }
      .footer p {
        margin: 0;
      }
      dialog {
        max-width: min(1100px, 94vw);
        max-height: 94vh;
        padding: 42px 12px 12px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--text);
        border-radius: 14px;
      }
      dialog::backdrop {
        background: rgb(0 0 0 / 0.72);
      }
      dialog img {
        max-width: 100%;
        max-height: 78vh;
        display: block;
        margin: auto;
      }
      #close {
        position: absolute;
        right: 10px;
        top: 6px;
        background: transparent;
        border: 0;
        font-size: 14px;
        padding: 2px 10px;
      }
      @media (max-width: 560px) {
        header {
          padding: 12px 18px;
          min-height: 62px;
        }
        main {
          width: calc(100% - 36px);
          margin-top: 28px;
        }
        .question {
          padding: 12px 18px;
          font-size: 15px;
        }
        h1 {
          font-size: 22px;
        }
        h2 {
          font-size: 18px;
        }
        .image-open img {
          max-height: 280px;
        }
        .footer {
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">▧</span>正文配图
        <span style="color: var(--muted); font-weight: 400">/ 效果预览</span>
      </div>
      <button id="theme" type="button" aria-pressed="false">深色模式</button>
    </header>
    <main>
      <div class="question">荷花和睡莲怎么区分？请配上图片，直观说明一下。</div>
      <article aria-label="助手回答示例">
        <div class="byline"><span class="avatar" aria-hidden="true">✳</span>助手</div>
        <h1>看叶片，比看花色更容易区分</h1>
        <p class="lead">
          可以先记住两个线索：<strong>荷花常挺出水面，睡莲的叶片通常浮在水面。</strong>下面把对应图片放在说明后，方便对照。
        </p>
        {{CONTENT}}
        <p class="tip">
          <strong>观察小提示</strong
          >　花色和名称都可能混淆，结合叶片是否浮水、有没有缺口，以及是否出现莲蓬来判断更可靠。
        </p>
        <div class="footer">
          <p>回答布局演示 · 图片来自真实搜索<br />点击图片可放大查看</p>
          <p>DSH Reply with images</p>
        </div>
      </article>
    </main>
    <dialog id="lightbox" aria-label="图片放大预览">
      <button id="close" type="button">关闭 ✕</button>
    </dialog>
    <script>
      const theme = document.querySelector('#theme')
      theme.addEventListener('click', () => {
        const dark = theme.getAttribute('aria-pressed') !== 'true'
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        theme.setAttribute('aria-pressed', String(dark))
        theme.textContent = dark ? '浅色模式' : '深色模式'
      })
      const dialog = document.querySelector('#lightbox')
      document.querySelectorAll('.image-open').forEach((button) =>
        button.addEventListener('click', () => {
          const image = button.querySelector('img')
          dialog.querySelector('img')?.remove()
          const large = document.createElement('img')
          large.src = image.src
          large.alt = image.alt
          dialog.append(large)
          dialog.showModal()
        }),
      )
      document.querySelector('#close').addEventListener('click', () => dialog.close())
      dialog.addEventListener('click', (event) => {
        if (event.target === dialog) dialog.close()
      })
    </script>
    <!-- 真实生成时间：{{GENERATED_AT}}。此页模拟回答排版，不代表完整模型会话验收。 -->
  </body>
</html>
